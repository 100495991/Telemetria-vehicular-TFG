server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Autenticacion basica para todo el sitio (dashboard + /api): el broker
    # queda protegido con usuario/contrasena, pero si el dashboard se expone
    # a internet sin login cualquiera con la URL ve la ubicacion en vivo del
    # vehiculo. Credenciales en .htpasswd (gitignored, ver README).
    auth_basic           "TFG Telemetria";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Estaticos del dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # app.js/styles.css cambian con cada despliegue: sin esto, el navegador
    # puede seguir sirviendo una version vieja desde cache con un F5 normal
    # (hace falta cache-control explicito, nginx no manda ninguno por defecto).
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Todo lo que cuelga de /api se reenvia al backend FastAPI.
    # Asi el navegador habla siempre con el mismo origen y no hay CORS.
    # (Hereda auth_basic del bloque server: sin login tambien queda bloqueado.)
    location /api/ {
        # Resolver embebido de Docker: obliga a nginx a re-resolver el DNS de
        # 'api' en cada peticion. Sin esto, nginx cachea la IP del contenedor al
        # arrancar y devuelve 502 si 'api' se recrea con otra IP (rebuild, etc.).
        resolver 127.0.0.11 valid=10s;
        set $upstream_api api;
        proxy_pass http://$upstream_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
