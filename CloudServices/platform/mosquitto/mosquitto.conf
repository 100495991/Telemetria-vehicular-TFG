# =============================================================================
# Mosquitto — broker MQTT privado del TFG
#
# Autenticacion obligatoria: el broker esta expuesto a internet (el Arduino
# se conecta via GPRS, red movil, no la red local), asi que exige usuario y
# contrasena (ver README, seccion "Activar autenticacion"). Credenciales en
# platform/mosquitto/passwd (usuario "arduino"), generadas con mosquitto_passwd.
# =============================================================================

listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd

# Persistencia: sobrevive reinicios del contenedor (mensajes retained como la
# cabecera del CSV, que asi se conserva aunque se reinicie el broker)
persistence true
persistence_location /mosquitto/data/

# Logs a fichero ademas de stdout
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type notice
log_type information
